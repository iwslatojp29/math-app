<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>理科・社会 - コンテンツ一覧</title>
<style>
body { font-family: -apple-system, "Hiragino Sans", sans-serif; max-width: 700px; margin: 0 auto; padding: 20px; background: #f5f5f5; }
h1 { color: #333; border-bottom: 3px solid #2196F3; padding-bottom: 10px; }
.card { background: white; border-radius: 10px; padding: 20px; margin: 15px 0; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
.card a { color: #1a73e8; text-decoration: none; font-size: 1.1em; font-weight: bold; }
.card a:hover { text-decoration: underline; }
.card p { color: #666; margin-top: 8px; }
.back-link { display: inline-block; margin-bottom: 20px; color: #1a73e8; text-decoration: none; font-weight: bold; }
.back-link:hover { text-decoration: underline; }
.upload-btn { display: inline-block; margin-top: 30px; padding: 12px 24px; background: #2196F3; color: white; text-decoration: none; border-radius: 8px; font-size: 1em; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
.upload-btn:hover { background: #1976D2; }
.tabs { margin: 20px 0 10px; }
.tab-btn { padding: 8px 20px; margin-right: 8px; border: 2px solid #2196F3; background: white; color: #1a73e8; border-radius: 20px; font-size: 0.95em; font-weight: bold; cursor: pointer; font-family: inherit; }
.tab-btn.active { background: #2196F3; color: white; }
</style>
</head>
<body>
<a class="back-link" href="../">← トップへ戻る</a>
<h1 id="page-title">理科・社会</h1>

<div class="tabs">
  <button class="tab-btn active" data-filter="all">すべて</button>
  <button class="tab-btn" data-filter="理科">理科</button>
  <button class="tab-btn" data-filter="社会">社会</button>
</div>

<div id="card-list">
<div class="card" id="placeholder-card">
  <a href="#">理科・社会コンテンツ準備中</a>
  <p>今後ここに理科・社会の解説ページを追加します</p>
</div>
  <div class="card" data-subject="理科">
    <a href="./SAPIX_%E5%B0%8F4_8%E6%9C%88_%E7%90%86%E7%A7%91%E7%A4%BE%E4%BC%9A_%E8%A7%A3%E7%AD%94%E8%A7%A3%E8%AA%AC.html">【理科】SAPIX 小4 8月マンスリー｜理科・社会 解答解説</a>
  </div>
<!-- CARDS -->
</div>

<a class="upload-btn" href="./upload.html">＋ 新しいページを追加</a>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var ph = document.getElementById('placeholder-card');
  var cards = document.querySelectorAll('#card-list .card[data-subject]');
  if (ph && cards.length > 0) ph.parentNode.removeChild(ph);

  function applyFilter(f) {
    document.querySelectorAll('.tab-btn').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-filter') === f);
    });
    cards.forEach(function (c) {
      c.style.display = (f === 'all' || c.getAttribute('data-subject') === f) ? '' : 'none';
    });
    var h = document.getElementById('page-title');
    if (h) h.textContent = (f === 'all') ? '理科・社会' : f;
  }

  document.querySelectorAll('.tab-btn').forEach(function (btn) {
    btn.addEventListener('click', function () { applyFilter(btn.getAttribute('data-filter')); });
  });

  var q = new URLSearchParams(location.search).get('subject');
  applyFilter((q === '理科' || q === '社会') ? q : 'all');
});
</script>
</body>
</html>
