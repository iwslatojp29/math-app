<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>計算力テスト 書き込み見本</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kurenaido&family=Shippori+Mincho:wght@500;700&display=swap">
<style>
/* layout: 机の上の問題用紙1枚。明朝の印刷の上に鉛筆を重ね、上の固定バーで「モード・問題・一手ずつ」を操作する。単一テーマ（紙と机）。
   書き込みはすべて行の中に場所をとる（重ならない）。筆算は小数点の列を幅0にして桁をそろえる。 */
:root{
  --desk:#4f6157; --desk-deep:#3c4b43; --paper:#fdfdfb; --print:#151515; --rule:#b9bdb6;
  --pencil:#2f4391;
  --c0:var(--pencil); --c1:#d2362c; --c2:#14874a; --c3:#d97a00; --c4:#8b3fc4; --c5:#0d8fa3;
  --mind:#6a4700;
  --think:#3d4742; --think-bg:#fff2bf; --think-line:#b99a2e;
  --ui-bg:#f5f7f4; --ui-fg:#1f2d27; --ui-sub:#5b6a63; --ui-line:#cfd6d0; --ui-on:#235c80;
  --hand:"Zen Kurenaido","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --mincho:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --ui:"Hiragino Sans","Yu Gothic","Meiryo",system-ui,sans-serif;
  --cw:14px; --bar:120px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--bar) + 8px)}
body{background:var(--desk);color:var(--print);font-family:var(--mincho)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid #e0a020;outline-offset:2px}

/* ── 固定バー ── */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--ui-bg);color:var(--ui-fg);font-family:var(--ui);border-bottom:1px solid var(--ui-line);box-shadow:0 2px 8px rgba(0,0,0,.18);padding:8px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.bar h1{font:700 18px var(--mincho);margin:0;letter-spacing:.08em;white-space:nowrap}
.bar h1 small{font:500 11px var(--ui);color:var(--ui-sub);letter-spacing:0;margin-left:6px}
.seg{display:flex;border:1px solid var(--ui-line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:0 12px;min-height:40px;font-size:14px;line-height:1.25}
.seg button+button{border-left:1px solid var(--ui-line)}
.seg button[aria-pressed="true"]{background:var(--ui-on);color:#fff;font-weight:700}
.seg small{font-size:.8em;font-weight:400}
.tg{min-height:40px;padding:0 12px;border:1px dotted var(--think-line);background:#fff;border-radius:8px;font-size:14px}
.tg[aria-pressed="true"]{background:var(--think-bg);font-weight:700}
.qs{display:flex;gap:4px;overflow-x:auto;max-width:100%;padding:2px}
.qs button{flex:none;width:38px;height:38px;border:1px solid var(--ui-line);background:#fff;border-radius:50%;font-size:15px;font-variant-numeric:tabular-nums}
.qs button[aria-current="true"]{background:var(--ui-on);border-color:var(--ui-on);color:#fff;font-weight:700}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-left:auto}
.ctl button{min-height:40px;padding:0 12px;border:1px solid var(--ui-line);background:#fff;border-radius:8px;font-size:14px}
.ctl button:disabled{opacity:.4;cursor:default}
.ctl #prev,.ctl #next{background:var(--ui-on);border-color:var(--ui-on);color:#fff;font-weight:700;min-width:5.2em}
.ctl #auto[aria-pressed="true"]{background:var(--c1);border-color:var(--c1);color:#fff}
.count{font-size:13px;color:var(--ui-sub);min-width:4.2em;text-align:center;font-variant-numeric:tabular-nums}
#roundSel{min-height:40px;border:1px solid var(--ui-line);border-radius:8px;background:#fff;padding:0 8px;font:700 15px var(--ui);color:var(--ui-fg)}
@media(min-width:1100px){#roundSel{display:none}}
@media(max-width:1099px){#ttl{display:none}}

/* ── 回の一覧（広い画面だけ） ── */
.page{display:grid;grid-template-columns:minmax(0,1fr)}
.rounds{display:none}
@media(min-width:1100px){
  .page{grid-template-columns:104px minmax(0,1fr)}
  .rounds{display:flex;flex-direction:column;gap:1px;position:sticky;top:calc(var(--bar) + env(safe-area-inset-top,0px));align-self:start;max-height:calc(100dvh - var(--bar));overflow-y:auto;background:var(--desk-deep);padding:8px 6px;font-family:var(--ui)}
  .rounds button{border:0;background:none;color:#cfd9d3;text-align:left;padding:5px 10px;border-radius:6px;font-size:13.5px;font-variant-numeric:tabular-nums}
  .rounds button:disabled{color:#7d8d85;cursor:default}
  .rounds button[aria-current="true"]{background:var(--paper);color:var(--print);font-weight:700}
}
.stage{padding-inline:16px;padding-block:24px 70vh;min-width:0}

/* ── 問題用紙 ── */
.sheet{max-width:800px;margin-inline:auto;background:var(--paper);box-shadow:0 10px 28px rgba(20,30,25,.3);padding:22px clamp(12px,4vw,40px) 36px;display:flex;flex-direction:column;gap:10px}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;border-block:3px double var(--print);padding-block:8px}
.head b{font-size:1.5rem;letter-spacing:.12em}
.legend{margin:0 0 0 auto;font:12px/1.7 var(--ui);color:#444;display:flex;flex-wrap:wrap;gap:1px 12px;align-items:center}
.legend i{font:normal 1.15em var(--hand)}
.legend .kk{font-size:1em}
.q{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:10px;align-items:baseline;border-bottom:1px dotted var(--rule);padding:22px 4px 16px;border-radius:4px}
.q:last-of-type{border-bottom:0}
.q.cur{box-shadow:-5px 0 0 var(--ui-on)}
.n{font-size:1.1rem}
.src{position:absolute;right:4px;top:4px;font-size:12px;color:#555;line-height:1.3;letter-spacing:.02em}
.b{min-width:0;display:flex;flex-direction:column;gap:10px;overflow-x:auto;padding:0 3px 2px}
.f{font-size:20px;line-height:1.75;word-spacing:.22em;padding:2px 2px}
.t{font-size:17px;line-height:2.15;margin:0}
.t::after{content:"";display:block;clear:both}
.figbox{float:right;margin:0 0 8px 16px;line-height:1}
.fig{display:block;max-width:100%;height:auto;mix-blend-mode:multiply}
.tbl{border-collapse:collapse;font-size:16px;line-height:1.5}
.tbl td,.tbl th{border:1.3px solid var(--print);padding:4px 10px;text-align:center;min-width:3.4em;height:2.4em;font-weight:500}
.h{font-family:var(--hand);color:var(--pencil);-webkit-text-stroke:.35px currentColor}
.h small,.an small,.nw small{font-size:.8em}

/* 分数 */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;line-height:1.15;font-size:.9em;text-align:center;margin:0 .12em;word-spacing:0;white-space:nowrap}
.fr>.fn{border-bottom:1.5px solid currentColor;padding:0 .2em 1px}
.fr>.fd{padding:1px .2em 0}
.fr.g{display:inline-grid;grid-template-columns:auto auto}
.fr.g>.fn{grid-area:1/1;padding-top:.3em}
.fr.g>.fd{grid-area:2/1;padding-bottom:.3em}
.fr.g>.fw{grid-column:2;display:flex;text-align:left}
.fr.g>.fw.fwn{grid-row:1;align-items:flex-start}
.fr.g>.fw.fwd{grid-row:2;align-items:flex-end}

/* 斜線で消して書き直す（約分は操作ごとに色をそろえる）。右肩メモも同じ形 */
.x2{display:inline-flex;vertical-align:baseline;white-space:nowrap;word-spacing:0}
.x2.u{align-items:flex-start}
.x2.d{align-items:flex-end}
.xo{position:relative;display:inline-block;padding:0 1px;line-height:1.25}
.x2.u>.xo{margin-top:.22em}
.x2.d>.xo{margin-bottom:.3em}
.sl{position:absolute;inset:-1px -3px;pointer-events:none;background:linear-gradient(to top right,transparent calc(50% - 1px),var(--c) calc(50% - 1px),var(--c) calc(50% + 1px),transparent calc(50% + 1px))}
.nw{font:normal .8em/1.05 var(--hand);color:var(--c);padding-left:1px;-webkit-text-stroke:.35px currentColor;white-space:nowrap}
.nw .nw{font-size:1em;padding-left:2px}
.nw .xo{padding:0 2px}
.fw>.nw{font-size:.86em}

/* 上・下への書き込み（行の中に場所をとるので重ならない） */
.up2{display:inline-block;vertical-align:baseline;text-align:center;white-space:nowrap}
.up2>.an,.up2>.bs,.up2>.obl{display:block}
.dn2{display:inline-flex;flex-direction:column;align-items:center;vertical-align:baseline;white-space:nowrap}
.an{font-family:var(--hand);color:var(--pencil);-webkit-text-stroke:.35px currentColor;line-height:1.3;white-space:nowrap;word-spacing:.12em}
.up2>.an{margin-bottom:1px}
.dn2>.an{margin-top:1px}
.ubl{display:block;align-self:stretch;height:8px;border:1.5px solid var(--pencil);border-top:0;border-radius:0 0 9px 9px;margin-top:2px}
.obl{height:8px;border:1.5px solid var(--pencil);border-bottom:0;border-radius:9px 9px 0 0;margin-bottom:2px}
.ci{position:relative;display:inline-block;margin:0 .36em;line-height:1.25;white-space:nowrap}
.ci>.ring{position:absolute;inset:-.2em -.4em;border:1.7px solid var(--pencil);border-radius:50%;transform:rotate(-4deg);pointer-events:none}
.ul{position:relative;display:inline-block;line-height:1.25;white-space:nowrap}
.ul>.uln{position:absolute;left:-1px;right:-1px;bottom:-4px;height:5px;border-block:1.4px solid var(--pencil);pointer-events:none}
.box{display:inline-flex;align-items:center;justify-content:center;min-width:3.2em;min-height:2.3em;border:1.5px solid var(--print);vertical-align:middle;font-size:1.02em;padding:0 .3em;white-space:nowrap}
.tick{font-size:1.25em;margin-left:.3em}
.ans .tick{font-size:1em}
.sc{display:flex;flex-wrap:wrap;align-items:center;gap:10px 26px;font-size:20px;padding-left:2px}
.ans{margin-left:auto;align-self:flex-end;font-size:1.15em;border-bottom:3px double var(--pencil);padding:0 .4em 2px;white-space:nowrap}

/* 筆算：小数点の列は幅0。数字の列はすべて同じ幅 */
.hs{display:inline-flex;flex-direction:column;align-items:flex-start;line-height:1.25;font-variant-numeric:tabular-nums;word-spacing:0;white-space:nowrap;vertical-align:top}
.hs.hang{vertical-align:baseline}
.r{display:flex}
.r.h{font-size:21px}
.r.pr{font-family:var(--mincho);color:var(--print)}
.c{width:var(--cw);text-align:center;flex:none}
.c.op{display:flex;justify-content:center;transform:scaleX(.7)}
.pc{width:0;flex:none;position:relative}
.pt{position:absolute;left:0;bottom:0;transform:translateX(-50%);font-style:normal}
.psl{position:absolute;left:0;bottom:.06em;width:.4em;height:.42em;transform:translateX(-50%);background:linear-gradient(to top right,transparent calc(50% - .9px),currentColor calc(50% - .9px),currentColor calc(50% + .9px),transparent calc(50% + .9px))}
.r.sm{font-size:12.5px;line-height:13px;height:13px}
.rn{margin-left:10px;align-self:center;font-size:20px;white-space:nowrap}
.hup{text-align:left}
.hup>.an{display:flex;justify-content:center}
.nb{display:inline-block;white-space:nowrap}
[data-an]{display:inline-block;line-height:1.25}
.rule{display:block;align-self:stretch;border-top:1.6px solid currentColor;margin-block:2px;color:var(--pencil)}
.rule[style]{align-self:flex-start}
/* わり算の筆算 */
.dv{display:inline-grid;grid-template-columns:auto auto;line-height:1.25;font-variant-numeric:tabular-nums;word-spacing:0;white-space:nowrap;vertical-align:top;color:var(--pencil)}
.dvq{grid-area:1/2;margin-left:13px}
.dvd{grid-area:2/1;justify-self:end;padding-top:3px}
.dvn{grid-area:2/2;margin-left:13px;position:relative;padding-top:3px}
.dvn::before{content:"";position:absolute;left:-21px;top:0;width:19px;height:calc(100% + 3px);border-right:1.8px solid;border-radius:0 9px 9px 0/0 50% 50% 0}
.dvn::after{content:"";position:absolute;left:-11px;right:0;top:0;border-top:1.6px solid}
.dvw{grid-area:3/2;margin-left:13px;display:flex;flex-direction:column;align-items:flex-start}

/* 数字と数字を曲線で結ぶ */
.jn{display:inline-flex;flex-direction:column;align-items:center;vertical-align:baseline;white-space:nowrap}
.jn>svg.jl{display:block;align-self:stretch;width:0;min-width:100%;height:13px;overflow:visible}
svg.jl{color:var(--pencil)}
svg.jl path{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round}
.lk{display:inline-block;vertical-align:baseline;white-space:nowrap}
.lk>svg.jl{display:block;width:0;min-width:100%;height:11px;overflow:visible}
.lk>.bs{display:block}
/* すだれ算 */
.lad{display:inline-grid;line-height:1.3;font-size:20px;vertical-align:top;white-space:nowrap}
.ld{text-align:right;padding:0 6px 0 2px}
.ln{text-align:right;padding:0 8px;min-width:1.7em}
.ln.hk{border-bottom:1.5px solid currentColor}
.ln.h0{border-left:1.5px solid currentColor}
.jn>.jlb{align-self:flex-start}
.jn.jup{display:inline-block}
.jn.jup>.bs,.jn.jup>.jlb{display:block}
.jn.jup>.jlb{width:fit-content}

/* 図への書き込み */
.fg{position:relative;display:inline-block;line-height:1;max-width:100%;vertical-align:top}
.fg>img{display:block;width:100%;height:auto;mix-blend-mode:multiply}
.fg>.fgsp{display:block}
.fgs{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fgs .g{fill:none;stroke:var(--c,var(--pencil));stroke-width:1.6;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.fgs .g.dash{stroke-dasharray:5 4}
.fgs .g.pr{stroke:var(--print);stroke-width:1.3}
.fgs .g.fill{fill:var(--c,var(--pencil));fill-opacity:.16}
.gt{position:absolute;transform:translate(-50%,-50%);font-size:15px;line-height:1.1;white-space:nowrap}
.gt.pr{font-family:var(--mincho);color:var(--print);-webkit-text-stroke:0}

/* 暗算少なめモードで書き足す分＝茶。頭の中（書かない）＝黄色の点線 */
[data-m]{color:var(--mind)}
.ubl[data-m],.obl[data-m]{border-color:var(--mind)}
.nw[data-m]{color:var(--c)}
.rule[data-m],svg.jl[data-m],.dv [data-m]{color:var(--mind)}
.fgs .g[data-m]{stroke:var(--mind)}
.kk,:is(.an,.h,.nw,.gt,.jlb)[data-k],body:not(.mind) :is(.an,.h,.nw,.gt,.jlb)[data-x]{font-family:var(--hand);color:var(--think);background:var(--think-bg);border:1px dotted var(--think-line);border-radius:9px;padding:0 6px;font-size:.8em;line-height:1.4;-webkit-text-stroke:0;white-space:nowrap;word-spacing:.1em}
.h.kk{display:inline-block;margin:0 .25em}
svg.jl[data-k],body:not(.mind) svg.jl[data-x]{color:var(--think-line)}
svg.jl[data-k] path,body:not(.mind) svg.jl[data-x] path{stroke-dasharray:2 3}
.fgs .g[data-k],body:not(.mind) .fgs .g[data-x]{stroke:var(--think-line);stroke-dasharray:2 3}
body.mind [data-x]{color:var(--mind)}
body.mind :is(.ubl,.obl)[data-x]{border-color:var(--mind)}
body.mind .fgs .g[data-x]{stroke:var(--mind)}
body.nok:not(.mind) [data-x]{display:none!important}
body:not(.mind) [data-m]{display:none!important}
body.mind [data-a]{display:none!important}
body.nok [data-k]{display:none!important}

/* 一手ずつ */
.off{visibility:hidden}
.rv{animation:fade .45s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sl.rv,.ring.rv,.ubl.rv,.obl.rv,.uln.rv,.rule.rv{animation:draw .45s ease-out}
@keyframes draw{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@media(prefers-reduced-motion:reduce){.rv{animation:none!important}}
@media(max-width:560px){
  .f{font-size:17px}.t{font-size:15.5px}.sc{font-size:18px}:root{--cw:12.5px}.r.h:not(.sm){font-size:19px}.rn{font-size:17px}
  .bar{padding:5px 10px;gap:5px 6px}.seg{flex:1}.seg button{flex:1;padding:0 8px;font-size:13px;min-height:38px}
  .tg{min-height:38px;padding:0 9px;font-size:13px}
  .qs button{width:34px;height:34px;font-size:14px}
  .ctl{flex:1;flex-wrap:nowrap;overflow-x:auto;margin-left:0}.ctl button{flex:none;padding:0 9px;font-size:13px;min-height:38px}
}
</style>

<div class="bar" id="bar">
  <h1><span id="ttl">第1回</span><small>v2.0</small></h1>
  <select id="roundSel" aria-label="回を選ぶ"></select>
  <div class="seg" role="group" aria-label="表示モード">
    <button id="modeW" aria-pressed="true">暗算多め<small>（書く量 少）</small></button>
    <button id="modeM" aria-pressed="false">暗算少なめ<small>（書く量 多）</small></button>
  </div>
  <button id="think" class="tg" aria-pressed="true" title="頭の中の暗算のしかたを表示する／かくす">頭の中</button>
  <div class="qs" id="qs" role="group" aria-label="問題番号"></div>
  <div class="ctl">
    <button id="prev" aria-label="一手戻る">◀ 戻る</button>
    <span class="count" id="count" aria-live="polite"></span>
    <button id="next" aria-label="一手進む">進む ▶</button>
    <button id="clear">最初から</button>
    <button id="auto" aria-pressed="false">自動で再生</button>
    <button id="all">完成形</button>
  </div>
</div>

<div class="page">
  <nav class="rounds" id="rounds" aria-label="回の一覧"></nav>
  <main class="stage">
    <div class="sheet" id="sheet">
      <div class="head">
        <b id="hd">第1回</b>
        <p class="legend"><span>明朝＝印刷</span><span><i style="color:var(--pencil)">青＝鉛筆で書く</i></span><span><i><span style="color:var(--c1)">色</span><span style="color:var(--c2)">つ</span><span style="color:var(--c3)">き</span></i>＝同じ色どうしで約分・組</span><span><i style="color:var(--mind)">茶＝暗算少なめで書き足す</i></span><span><span class="kk">頭の中</span>＝書かない</span></p>
      </div>
    </div>
  </main>
</div>

<script>
(function(){
/* ── 手順の指定：数字=両モードで書く / 'Nm'=暗算少なめだけで書く(茶) / 'Nk'=頭の中(両モード) / 'Na'=頭の中(暗算多めだけ)
      / 'Nx'=同じ中身を、暗算少なめでは書き(茶)、暗算多めでは頭の中として見せる ── */
const ds=s=>{
  if(typeof s==='number')return `data-s="${s}"`;
  const m=/^(\d+)([mkax]?)$/.exec(String(s));
  if(!m)return `data-s="1" data-err="手順の指定が不正: ${String(s).replace(/"/g,'')}"`;
  return `data-s="${m[1]}"`+(m[2]==='m'?' data-m':m[2]==='k'?' data-k':m[2]==='a'?' data-k data-a':m[2]==='x'?' data-x':'');
};
/* ── 書き込みの部品 ── */
function F(n,d){
  const nx=n&&n.x,dx=d&&d.x;
  if(nx||dx)return `<span class="fr g"><span class="fn">${nx?nx.xo:n}</span><span class="fw fwn">${nx?nx.nw:''}</span><span class="fd">${dx?dx.xo:d}</span><span class="fw fwd">${dx?dx.nw:''}</span></span>`;
  return `<span class="fr"><span class="fn">${n}</span><span class="fd">${d}</span></span>`;
}
const H=(s,h,c='')=>`<span class="h ${c}" ${ds(s)}>${h}</span>`;
const Mo=(s,h)=>H(s+'m',h);
const K=(s,h)=>`<span class="h kk" ${ds(s+'k')}>${h}</span>`;
const KA=(s,h)=>`<span class="h kk" ${ds(s+'a')}>${h}</span>`;
const sm=h=>`<small>${h}</small>`;
const NB=h=>`<span class="nb">${h}</span>`;
function X(o,n,c,s,dir='u'){
  const a=ds(s),st=`style="--c:${c===0&&/m$/.test(String(s))?'var(--mind)':`var(--c${c})`}"`;
  const xo=`<span class="xo" ${st}>${o}<i class="sl" ${a}></i></span>`;
  const nw=(n===''||n===undefined||n===null)?'':`<span class="nw" ${st} ${a}>${n}</span>`;
  const S=new String(`<span class="x2 ${dir==='d'?'d':'u'}">${xo}${nw}</span>`);
  S.x={xo,nw};return S;
}

/* 別の行にある数字（目印 a）から、この式の上へ曲線を引く。行をまたいで計算をつなぐとき */
const LINK=(b,s,a)=>`<span class="lk" data-lk="${a}"><svg class="jl" ${ds(s)}></svg><span class="bs">${b}</span></span>`;
/* すだれ算。rows=[[手順, わる数('' なら線なしの最後の行), [数字…]], …] */
function LAD(rows){
  const n=Math.max(...rows.map(r=>r[2].length));
  let o=`<span class="lad h" style="grid-template-columns:auto repeat(${n},auto)">`;
  rows.forEach(r=>{const [s,d,nums]=r,a=ds(s),hook=!(d===''||d===null||d===undefined);
    o+=`<span class="ld" ${a}>${hook?d:''}</span>`+nums.map((x,i)=>`<span class="ln${hook?' hk':''}${hook&&i===0?' h0':''}" ${a}>${x}</span>`).join('')+'<span></span>'.repeat(n-nums.length);});
  return o+'</span>';
}
/* ── 筆算 ── */
const isRule=t=>t==='---'||/^[ _]*_[ _]*$/.test(t);
const gtext=t=>t[0]==='^'?' '+t.slice(1):t;
function grid(ts){const pc=new Set();let W=0;ts.forEach(t=>{W=Math.max(W,t.length);[...t].forEach((ch,i)=>{if(ch==='.'||ch==="'")pc.add(i);});});return {W,pc};}
function cells(text,g,ov){
  const small=text[0]==='^',t=gtext(text);let o='';
  for(let i=0;i<g.W;i++){
    let ch=t[i]||' ';
    const a=ov&&ov[i]!==undefined?' '+ds(ov[i]):'';
    if(g.pc.has(i)){
      if(ch==='.')o+=`<span class="pc"><i class="pt"${a}>.</i></span>`;
      else if(ch==="'")o+=`<span class="pc"><i class="pt">.</i><i class="psl"${a}></i></span>`;
      else if(ch===' ')o+='<span class="pc"></span>';
      else o+=`<span class="c" data-err="筆算：小数点の列（${i}文字目）に「${ch}」がある。小数点のある列は、ほかの行では空白にする">${ch}</span>`;
    }else{
      if(small&&ch==='a')ch='10';
      if(ch==='-')ch='−';

    }

function hrow(r,g,cls='h'){
  const [s,t,ov]=r;

  if(t.includes(')'))return `<span class="r" data-err="筆算の行に ) がある。わり算は DIV を使う">${t}</span>`;
  if(isRule(t)){

    return `<span class="rule" ${ds(s)} style="margin-left:calc(var(--cw)*${cnt(0,a)});width:calc(var(--cw)*${cnt(a,b+1)})"></span>`;
  }
  return `<span class="r ${cls}${t[0]==='^'?' sm':''}" ${ds(s)}${ov&&ov.c!==undefined?` style="color:var(--c${ov.c})"`:''}>${cells(t,g,ov)}${ov&&ov.note?`<span class="rn">${ov.note}</span>`:''}</span>`;

const texts=rows=>rows.filter(r=>typeof r[1]==='string'&&!isRule(r[1])).map(r=>gtext(r[1]));

function HANG(printed,rows,o){
  if(o!==undefined&&(o===null||typeof o!=='object'))return `<span data-err="HANG の書き方が古い。1つ目に印刷の行（空白で位置をそろえた文字列）を渡す。3つ目は {up:[手順,'上に書くもの']} だけ">${printed}</span>`;
  const g=grid([printed,...texts(rows)]);
  const h=`<span class="hs hang"><span class="r pr">${cells(printed,g)}</span>${rows.map(r=>hrow(r,g)).join('')}</span>`;
  if(!(o&&o.up))return h;
  const a=printed.search(/\S/),b=printed.trimEnd().length,cnt=(lo,hi)=>{let n=0;for(let i=lo;i<hi;i++)if(!g.pc.has(i))n++;return n;};
  return `<span class="up2 hup"><span class="an" ${ds(o.up[0])} style="margin-left:calc(var(--cw)*${cnt(0,a)});width:calc(var(--cw)*${cnt(a,b)})">${o.up[1]}</span><span class="bs">${h}</span></span>`;
}
/* わり算の筆算。dv=わる数の行 [手順,文字列,{列:手順}]、dd=わられる数の行、q=商の行、rows=下に続く行 */
function DIV(dv,dd,q,rows){

}

;}catch(e){console.error('ROUND 80: '+e.message);}

/* ── 組み立て ── */
const sheet=document.getElementById('sheet'),qsEl=document.getElementById('qs'),rounds=document.getElementById('rounds'),sel=document.getElementById('roundSel');
const num='①②③④⑤⑥⑦⑧⑨⑩';
let R=0,els=[],max=[],k=[],cur=0,timer=null,spyLock=0;
const $=id=>document.getElementById(id);
const avail=Object.keys(ROUNDS).map(Number).sort((a,b)=>a-b);
for(let r=1;r<=80;r++){
  const b=document.createElement('button');b.textContent='第'+r+'回';b.dataset.r=r;
  if(!ROUNDS[r])b.disabled=true;else b.onclick=()=>load(r,true);
  rounds.appendChild(b);
  if(ROUNDS[r]){const o=document.createElement('option');o.value=r;o.textContent='第'+r+'回';sel.appendChild(o);}
}
sel.onchange=()=>load(+sel.value,true);
function load(r,top){
  if(!ROUNDS[r])return false;
  stop();R=r;cur=0;els=[];max=[];k=[];
  sheet.querySelectorAll('.q').forEach(e=>e.remove());qsEl.innerHTML='';
  $('ttl').textContent=$('hd').textContent='第'+r+'回';sel.value=r;
  [...rounds.children].forEach(b=>{const on=+b.dataset.r===r;b.setAttribute('aria-current',on);if(on&&b.scrollIntoView&&getComputedStyle(rounds).display!=='none')b.scrollIntoView({block:'nearest'});});
  ROUNDS[r].forEach((q,i)=>{
    const d=document.createElement('section');d.className='q';d.id='q'+(i+1);
    const parts=q.parts||[q.f!==undefined?{f:q.f}:{t:q.t}];
    let h=`<span class="n">${num[i]||i+1}</span><div class="b">`;
    parts.forEach((p,j)=>{
      const fig=(j===0&&q.fig)?`<span class="figbox">${q.fig}</span>`:'';
      if(p.f!==undefined)h+=`<div class="f">${fig}${p.f}</div>`;
      else h+=`<p class="t">${fig}${p.t}</p>`;
    });
    h+=`<div class="sc">${q.sc||''}</div></div>`+(q.src?`<span class="src">（${q.src}）</span>`:'');
    d.innerHTML=h;
    sheet.appendChild(d);els.push(d);max.push(q.n);k.push(0);
    d.addEventListener('click',()=>select(i,false));
    const b=document.createElement('button');b.textContent=i+1;b.setAttribute('aria-label','問題'+(i+1));
    b.addEventListener('click',()=>select(i,true));qsEl.appendChild(b);
    paint(i);
  });
  try{localStorage.setItem('kk-round',r);}catch(e){}
  if(top){spyLock=performance.now()+300;scrollTo(0,0);}
  ui();fit();joins();
  return true;
}
function paint(i,animate){
  els[i].querySelectorAll('[data-s]').forEach(e=>{
    const s=+e.dataset.s;
    e.classList.toggle('off',s>k[i]);
    e.classList.toggle('rv',!!animate&&s===k[i]);
  });
}
/* 曲線：結ぶ2つの数字の位置を測って、その下（上）に弧をかき、弧のまん中に結果を置く */
function joins(){
  sheet.querySelectorAll('.jn').forEach(j=>{
    const [a,b]=j.dataset.j.split(','),bs=j.querySelector(':scope>.bs'),svg=j.querySelector(':scope>svg.jl'),lb=j.querySelector(':scope>.jlb');
    const ea=bs.querySelector(`[data-an="${a}"]`),eb=bs.querySelector(`[data-an="${b}"]`);
    if(!ea||!eb){j.dataset.err=`JOIN：目印 ${!ea?a:b} が中に見つからない`;return;}
    const up=j.classList.contains('jup');
    for(let pass=0;pass<2;pass++){
      const J=j.getBoundingClientRect(),ra=ea.getBoundingClientRect(),rb=eb.getBoundingClientRect(),rs=svg.getBoundingClientRect();
      if(!rs.width)return;
      const xa=ra.left+ra.width/2-rs.left,xb=rb.left+rb.width/2-rs.left,Hh=rs.height;
      let d;
      if(up){const g1=Math.max(0,ra.top-rs.bottom-2),g2=Math.max(0,rb.top-rs.bottom-2);
        d=`M${xa} ${Hh+g1}L${xa} ${Hh-1}C${xa} -3,${xb} -3,${xb} ${Hh-1}L${xb} ${Hh+g2}`;}
      else{const g1=Math.max(0,rs.top-ra.bottom-2),g2=Math.max(0,rs.top-rb.bottom-2);
        d=`M${xa} ${-g1}L${xa} 1C${xa} ${Hh+3},${xb} ${Hh+3},${xb} 1L${xb} ${-g2}`;}
      svg.innerHTML=`<path d="${d}"/>`;
      const lw=lb.getBoundingClientRect().width;
      lb.style.marginLeft=Math.max(0,(xa+xb)/2+(rs.left-J.left)-lw/2)+'px';
    }
  });
  sheet.querySelectorAll('.lk').forEach(j=>{
    const q=j.closest('.q'),ea=q&&q.querySelector(`[data-an="${j.dataset.lk}"]`),svg=j.querySelector(':scope>svg.jl'),bs=j.querySelector(':scope>.bs');
    if(!ea){j.dataset.err=`LINK：目印 ${j.dataset.lk} が同じ問題の中に見つからない`;return;}
    const ra=ea.getBoundingClientRect(),rs=svg.getBoundingClientRect(),rb=bs.getBoundingClientRect();
    if(!rs.width||!ra.width)return;
    const xa=ra.left+ra.width/2-rs.left,ya=ra.bottom+2-rs.top,xb=rb.left+rb.width/2-rs.left,yb=rs.height,m=(ya+yb)/2;
    svg.innerHTML=`<path d="M${xa} ${ya}C${xa} ${m},${xb} ${m},${xb} ${yb}"/>`;
  });
}
function ui(){
  if(!els.length)return;
  [...qsEl.children].forEach((b,i)=>b.setAttribute('aria-current',i===cur));
  els.forEach((e,i)=>e.classList.toggle('cur',i===cur));
  $('count').textContent=`${num[cur]} ${k[cur]} / ${max[cur]}`;
  const first=R===avail[0]&&cur===0&&k[0]===0,last=R===avail[avail.length-1]&&cur===els.length-1&&k[cur]===max[cur];
  $('prev').disabled=first;$('next').disabled=last;
  $('clear').disabled=k[cur]===0;$('all').disabled=k[cur]===max[cur];
  $('auto').setAttribute('aria-pressed',!!timer);
  $('auto').textContent=timer?'止める':'自動で再生';
}
function select(i,scroll){
  if(i!==cur){stop();cur=i;}
  ui();
  if(scroll){spyLock=performance.now()+300;els[i].scrollIntoView({behavior:'auto',block:'start'});}
}
/* いま画面に映っている問題を、自動で操作の対象にする */
function spy(){
  if(!els.length||performance.now()<spyLock)return;
  const line=$('bar').getBoundingClientRect().bottom+90;
  let i=els.findIndex(e=>e.getBoundingClientRect().bottom>line);
  if(i<0)i=els.length-1;
  if(i!==cur)select(i,false);
}
let raf=0;
addEventListener('scroll',()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;spy();});},{passive:true});
function set(v,animate){k[cur]=v;paint(cur,animate);ui();}
/* 進む：この問題の次の一手 → 終わっていたら次の問題の一手目 → 最後の問題なら次の回 */
function next(){
  if(k[cur]<max[cur]){set(k[cur]+1,true);return true;}
  if(cur<els.length-1){select(cur+1,true);if(k[cur]<max[cur])set(k[cur]+1,true);return true;}
  const j=avail.indexOf(R);
  if(j>=0&&j<avail.length-1){load(avail[j+1],true);return true;}
  return false;
}
function prev(){
  if(k[cur]>0){set(k[cur]-1);return;}
  if(cur>0){select(cur-1,true);return;}
  const j=avail.indexOf(R);
  if(j>0){load(avail[j-1],false);cur=els.length-1;k[cur]=max[cur];paint(cur);select(cur,true);}
}
function stop(){if(timer){clearInterval(timer);timer=null;}}
function auto(){
  if(timer){stop();ui();return;}
  if(k[cur]>=max[cur])set(0);
  const tick=()=>{if(k[cur]>=max[cur]){stop();ui();return;}set(k[cur]+1,true);if(k[cur]>=max[cur]){stop();ui();}};
  tick();
  if(k[cur]<max[cur]){timer=setInterval(tick,1700);ui();}
}
$('next').onclick=()=>{stop();next();};
$('prev').onclick=()=>{stop();prev();};
$('clear').onclick=()=>{stop();set(0);};
$('all').onclick=()=>{stop();set(max[cur]);};
$('auto').onclick=auto;
function mode(m){
  stop();
  document.body.classList.toggle('mind',m);
  $('modeM').setAttribute('aria-pressed',m);$('modeW').setAttribute('aria-pressed',!m);
  try{localStorage.setItem('kk-mode',m?'m':'w');}catch(e){}
  ui();fit();joins();
}
function think(on){
  document.body.classList.toggle('nok',!on);
  $('think').setAttribute('aria-pressed',on);
  try{localStorage.setItem('kk-think',on?'1':'0');}catch(e){}
  fit();joins();
}
$('modeW').onclick=()=>mode(false);
$('modeM').onclick=()=>mode(true);
$('think').onclick=()=>think(document.body.classList.contains('nok'));
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT'||e.altKey||e.ctrlKey||e.metaKey)return;
  if(e.key==='ArrowRight'){e.preventDefault();stop();next();}
  else if(e.key==='ArrowLeft'){e.preventDefault();stop();prev();}
});
function fit(){document.documentElement.style.setProperty('--bar',$('bar').offsetHeight+'px');}
addEventListener('resize',()=>{fit();joins();});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(joins);
let m0=false,r0=0,t0=true;
try{m0=localStorage.getItem('kk-mode')==='m';r0=+localStorage.getItem('kk-round')||0;t0=localStorage.getItem('kk-think')!=='0';}catch(e){}
const hr=+(location.hash.match(/^#r(\d+)$/)||[])[1]||0;
mode(m0);think(t0);
load(ROUNDS[hr]?hr:ROUNDS[r0]?r0:avail[0],false);
window.__kk={load,next,prev,mode,think,joins,all(){els.forEach((_,i)=>{k[i]=max[i];paint(i);});ui();},info:()=>({R,max,cur,k:k.slice()})};
})();
</script>
