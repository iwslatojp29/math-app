<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>国語 - コンテンツ一覧</title>
  <style>
    body {
      font-family: -apple-system, "Hiragino Sans", sans-serif;
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;
      background: #f5f5f5;
    }
    h1 {
      color: #333;
      border-bottom: 3px solid #2196F3;
      padding-bottom: 10px;
    }
    .card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      margin: 15px 0;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .card a {
      color: #1a73e8;
      text-decoration: none;
      font-size: 1.1em;
      font-weight: bold;
    }
    .card a:hover {
      text-decoration: underline;
    }
    .card p {
      color: #666;
      margin-top: 8px;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #1a73e8;
      text-decoration: none;
      font-weight: bold;
    }
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <a class="back-link" href="../">← トップへ戻る</a>
  <h1>国語</h1>

  <div class="card">
    <a href="#">国語コンテンツ準備中</a>
    <p>今後ここに国語の解説ページを追加します</p>
  </div>
</body>
</html>
