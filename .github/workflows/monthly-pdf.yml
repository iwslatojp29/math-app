name: Monthly PDF lessons
run-name: monthly-${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Private studio job ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: math-app-monthly-pdf
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      STUDIO_URL: https://math-app-proxy.iwslatojp29.workers.dev
      STUDIO_RUNNER_TOKEN: ${{ secrets.STUDIO_RUNNER_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      JOB_ID: ${{ inputs.job_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install private runner dependencies
        run: |
          python -m pip install --disable-pip-version-check -r automation/requirements.txt
          npm install --prefix "$RUNNER_TEMP/monthly-browser" --no-audit --no-fund playwright
          "$RUNNER_TEMP/monthly-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Process selected booklet and verify saved lessons
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/monthly-browser/node_modules/playwright/index.mjs
        run: python automation/run_monthly.py --job-id "$JOB_ID"
      - name: Report interrupted run
        if: ${{ failure() || cancelled() }}
        run: python automation/run_monthly.py --job-id "$JOB_ID" --report-failure
      # No upload-artifact step: original PDFs, page images, job JSON, model
      # intermediates and credentials remain private in temporary storage.
